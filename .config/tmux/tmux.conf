set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'

set -g mouse on                    # enable mouse support
set -g base-index 1                # start indexing windows at 1 instead of 0
set -g pane-base-index 1           # start indexing panes at 1 instead of 0
set -g renumber-windows on         # renumber all windows when any windows is closed
set -g set-clipboard on            # use system clipboard
set -g status-position bottom      # macOS / darwin style
set -g escape-time 0               # zero-out escape time delay
set -g default-terminal "${TERM}"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'

set -g @continuum-restore 'on'

set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style "custom"
set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_surface_1}]#[bg=#{@thm_surface_1},fg=#{@thm_fg}]"
set -g @catppuccin_window_middle_separator "#[bg=#{@thm_surface_1}] "
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_crust}]"
set -g @catppuccin_window_current_middle_separator "#[bg=#{@thm_mauve}] "
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_current_text " #{pane_current_command}#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_text " #{pane_current_command}"
set -g @catppuccin_directory_text " #{pane_current_path}"
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator no
set -g @catppuccin_directory_text " #{?#{==:#{USER},root},#{s|^/mnt/host/|/|;s|^/root$|~|;s|^/root/|~/|:pane_current_path},#{s|^/mnt/host/|/|:pane_current_path}}"
set -g status-right-length 100
set -g status-left-length 100
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -g status-left ""

run '~/.tmux/plugins/tpm/tpm'

set -g status-bg default
set -g status-style bg=default

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
